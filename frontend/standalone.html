/* ─── API helpers ─────────────────────────────────────────────────────── */
const BASE = '';

async function uploadPDF(file) {
  const form = new FormData();
  form.append('file', file);
  const r = await fetch(`${BASE}/api/upload`, { method: 'POST', body: form });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function startAnalysis(caseId) {
  const r = await fetch(`${BASE}/api/analyze?case_id=${caseId}`, { method: 'POST' });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function pollStatus(caseId) {
  const r = await fetch(`${BASE}/api/status/${caseId}`);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function getBrief(caseId) {
  const r = await fetch(`${BASE}/api/brief/${caseId}`);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function confirmBrief(caseId, name, decision, notes, causality) {
  const p = new URLSearchParams({ reviewer_name: name, reviewer_decision: decision });
  if (notes) p.set('reviewer_notes', notes);
  if (causality) p.set('reviewer_causality', causality);
  const r = await fetch(`${BASE}/api/confirm/${caseId}?${p}`, { method: 'POST' });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

const SERIOUS_COLOR = { 'Fatal':'#ef4444', 'Life-Threatening':'#f87171', 'Hospitalization / Prolonged Hospitalization':'#fb923c', 'Disability / Incapacity':'#fb923c', 'Medically Significant':'#fbbf24', 'Non-Serious':'#64748b' };
const SERIOUS_SHORT = { 'Hospitalization / Prolonged Hospitalization':'Hospitalization', 'Disability / Incapacity':'Disability' };

function caseMeta(demo, confirmation) {
  const b = demo.brief, r = b.regulatory;
  const urgent = r.expectedness?.startsWith('Unknown') && r.seriousness !== 'Non-Serious';
  const received = (r.day_zero || '').slice(0, 10);
  const receivedLabel = received ? new Date(received + 'T12:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }) : '';
  let status, statusColor;
  if (confirmation) { status = 'Confirmed'; statusColor = '#22c55e'; }
  else if (urgent) { status = 'Urgent review'; statusColor = '#f87171'; }
  else { status = 'Awaiting review'; statusColor = '#94a3b8'; }
  const route = urgent ? '15-day if unlisted' : r.reporting_trigger.startsWith('Periodic') ? 'Periodic' : r.reporting_trigger.split(' (')[0];
  return { urgent, receivedLabel, status, statusColor, route,
           seriousness: SERIOUS_SHORT[r.seriousness] || r.seriousness, seriousColor: SERIOUS_COLOR[r.seriousness] || '#94a3b8' };
}

function NewCaseButton({ onCaseStarted }) {
  const [open, setOpen] = useState(false);
  const [dragging, setDragging] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const inputRef = useRef();

  const handle = async (file) => {
    if (!file) return;
    if (!file.name.toLowerCase().endsWith('.pdf')) { setErr('Please choose a PDF case report.'); return; }
    setErr(null); setBusy(true);
    try {
      const { case_id } = await uploadPDF(file);
      await startAnalysis(case_id);
      setOpen(false);
      onCaseStarted(case_id);
    } catch (e) {
      setErr(location.protocol.startsWith('http') ? (e.message || 'Upload failed') : 'Uploading requires the Vigio server. Sample cases and Drug Safety Search work without it.');
    } finally { setBusy(false); }
  };

  return (
    <div>
      <button onClick={() => { setOpen(!open); setErr(null); }}
        style={{ width:'100%', display:'flex', alignItems:'center', justifyContent:'center', gap:8, background:'#2563eb', color:'#fff', border:'none', borderRadius:8, padding:'9px 12px', fontSize:13, fontWeight:600, cursor:'pointer' }}>
        {Icon.plus} New case
      </button>
      {open && (
        <div onClick={() => !busy && inputRef.current?.click()}
          onDragOver={e => { e.preventDefault(); setDragging(true); }} onDragLeave={() => setDragging(false)}
          onDrop={e => { e.preventDefault(); setDragging(false); handle(e.dataTransfer.files[0]); }}
          style={{ marginTop:8, border:`1px solid ${dragging ? '#3b82f6' : '#1e293b'}`, background: dragging ? '#16243b' : '#0b1220', borderRadius:8, padding:'14px 12px', textAlign:'center', cursor: busy ? 'default' : 'pointer' }}>
          <input ref={inputRef} type="file" accept=".pdf" hidden onChange={e => handle(e.target.files?.[0])} />
          {busy
            ? <p style={{ fontSize:12, color:'#94a3b8' }}>Uploading and starting analysis…</p>
            : <>
                <p style={{ fontSize:12.5, fontWeight:600, color:'#cbd5e1' }}>Upload case report (PDF)</p>
                <p style={{ fontSize:11, color:'#64748b', marginTop:3 }}>Drag a MedWatch, CIOMS or narrative PDF here, or click to browse</p>
              </>}
        </div>
      )}
      {err && <p style={{ marginTop:6, fontSize:11.5, color:'#fca5a5', lineHeight:1.5 }}>{err}</p>}
    </div>
  );
}

          <div style={{ minWidth:0 }}>
            <p style={{ fontSize:12, fontWeight:600, color:'#cbd5e1' }}>Demo Pharma</p>

}

/* ─── Progress Tracker ────────────────────────────────────────────────── */
function ProgressTracker({ status }) {
  const pct = status?.progress || 0;
  return (
    <div style={{ padding:40, display:'flex', flexDirection:'column', gap:20, maxWidth:520, margin:'auto', marginTop:80 }}>
      <p style={{ fontSize:18, fontWeight:600, color:'#e2e8f0' }}>Analyzing case…</p>
      <div style={{ background:'#1e293b', borderRadius:999, height:8, overflow:'hidden' }}>
        <div style={{ height:'100%', width:`${pct}%`, background:'linear-gradient(90deg,#1d4ed8,#60a5fa)', borderRadius:999, transition:'width 0.4s ease' }} />
      </div>
      <div style={{ display:'flex', justifyContent:'space-between' }}>
        <span style={{ fontSize:13, color:'#64748b' }}>{status?.current_step}</span>
        <span style={{ fontSize:13, fontWeight:700, color:'#60a5fa' }}>{pct}%</span>
      </div>
      {status?.status === 'error' && (
        <div style={{ background:'#450a0a', border:'1px solid #ef4444', borderRadius:8, padding:16, color:'#fca5a5', fontSize:13 }}>
          <strong>Analysis failed</strong><br />{status.error}
        </div>
      )}
    </div>
  );
}

/* ─── Brief Viewer ────────────────────────────────────────────────────── */
function BriefViewer({ brief, isDemo, onConfirmed, existingConfirmation }) {
  const [tab, setTab] = useState('summary');
  useEffect(() => { setTab('summary'); setConfirmed(!!existingConfirmation); setLocalConfirmation(existingConfirmation || null); setName(''); setDecision(''); setNotes(''); setCausality(''); }, [brief.case_id]);
  const [name, setName] = useState('');
  const [decision, setDecision] = useState('');
  const [notes, setNotes] = useState('');
  const [causality, setCausality] = useState('');
  const [confirming, setConfirming] = useState(false);
  const [confirmed, setConfirmed] = useState(false);
  const [localConfirmation, setLocalConfirmation] = useState(null);

  const e = brief.entities;
  const r = brief.regulatory;
  const c = brief.clinical;
  const p = brief.population;
  const tColor = TRIGGER_COLOR[r.reporting_trigger] || '#64748b';
  const aColor = ACTION_COLOR[brief.recommended_action] || '#64748b';

  const doConfirm = async () => {
    if (!name || !decision) return;
    setConfirming(true);
    try {
      if (isDemo) {
        // Demo mode — store locally
        await new Promise(res => setTimeout(res, 800));
        const conf = { reviewer_name: name, reviewer_decision: decision, reviewer_causality: causality, reviewer_notes: notes, confirmed_at: new Date().toISOString() };
        setLocalConfirmation(conf);
        setConfirmed(true);
        onConfirmed(brief.case_id, conf);
      } else {
        await confirmBrief(brief.case_id, name, decision, notes, causality);
        setConfirmed(true);
        onConfirmed(brief.case_id, { reviewer_name: name, reviewer_decision: decision, reviewer_causality: causality, reviewer_notes: notes, confirmed_at: new Date().toISOString() });
      }
    } finally { setConfirming(false); }
  };

  const confirmation = localConfirmation || brief.human_confirmation;

  const tabs = [
    { id:'source', label:'Source Case' },
    { id:'summary', label:'Summary' },
    { id:'regulatory', label:'Regulatory Safety' },
    { id:'clinical', label:'Clinical Safety' },
    { id:'population', label:'Population & Evidence' },
    { id:'confirm', label: confirmed ? '✓ Confirmed' : 'Confirm' },
  ];

  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100%', overflow:'hidden' }}>
      {/* Brief header */}
      <div style={{ padding:'16px 22px 0', display:'flex', justifyContent:'space-between', alignItems:'flex-start', flexShrink:0, gap:12 }}>
        <div style={{ minWidth:0 }}>
          <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:2 }}>
            <p style={{ fontSize:11, color:'#475569', textTransform:'uppercase', letterSpacing:'0.5px' }}>
              Case Intelligence Brief · {brief.case_id.toUpperCase()}
            </p>
            {isDemo && (
              <span style={{ fontSize:10, fontWeight:700, color:'#60a5fa', background:'#1d4ed822', border:'1px solid #1d4ed844', padding:'1px 7px', borderRadius:4 }}>
                SAMPLE
              </span>
            )}
          </div>
          <p style={{ fontSize:13, fontWeight:500, color:'#94a3b8', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
            {brief.source_pdf_filename}
          </p>
          {isDemo && (
            <p style={{ fontSize:11, color:'#a16207', marginTop:2 }}>Sample case. FAERS figures are real (2026Q3 snapshot); literature references are real publications.</p>
          )}
        </div>
        <div style={{ flexShrink:0 }}>
          {r.expectedness?.startsWith('Unknown')
            ? <Badge label="Trigger pending label check" color="#38bdf8" />
            : <Badge label={r.reporting_trigger} color={tColor} />}
        </div>
      </div>

      {/* Action banner */}
      <div style={{ margin:'12px 22px 0', padding:'11px 14px', background:`${aColor}18`, borderLeft:`3px solid ${aColor}`, borderRadius:'0 8px 8px 0', display:'flex', justifyContent:'space-between', alignItems:'center', flexShrink:0 }}>
        <div>
          <p style={{ fontSize:10, color:'#94a3b8', textTransform:'uppercase', letterSpacing:'0.5px', marginBottom:2 }}>AI Recommended Action</p>
          <p style={{ fontSize:14, fontWeight:700, color:'#e2e8f0' }}>{brief.recommended_action}</p>
        </div>
        <p style={{ fontSize:10, fontWeight:600, color:'#f59e0b', textAlign:'right', flexShrink:0 }}>
          Intelligence ≠ Determination<br/><span style={{ fontWeight:400, color:'#64748b' }}>Human review required</span>
        </p>
      </div>

      {/* Tabs */}
      <div style={{ display:'flex', padding:'10px 22px 0', gap:2, borderBottom:'1px solid #1e293b', flexShrink:0 }}>
        {tabs.map(t => (
          <button key={t.id} onClick={() => setTab(t.id)} style={{
            background: tab===t.id ? '#1e293b' : 'transparent',
            border: 'none', borderRadius:'6px 6px 0 0',
            color: tab===t.id ? '#e2e8f0' : '#64748b',
            fontSize:13, fontWeight: tab===t.id ? 600 : 400,
            padding:'7px 14px', cursor:'pointer'
          }}>{t.label}</button>
        ))}
      </div>

      {/* Tab content */}
      <div style={{ flex:1, overflowY:'auto', padding:'20px 22px' }}>

        {tab === 'source' && (
          <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
              <SectionTitle>Original Source Case</SectionTitle>
              <span style={{ fontSize:10, color:'#475569', background:'#1e293b', border:'1px solid #334155', padding:'3px 8px', borderRadius:4, fontFamily:'monospace' }}>{brief.source_pdf_filename}</span>
            </div>
            <div style={{ background:'#0a0f1a', border:'1px solid #1e3a5f', borderRadius:8, padding:'16px 18px' }}>
              <p style={{ fontSize:11, color:'#3b82f6', textTransform:'uppercase', letterSpacing:'0.5px', marginBottom:12, fontWeight:600 }}>Raw ICSR — as received before Vigio processing</p>
              <pre style={{ fontSize:12, color:'#94a3b8', lineHeight:1.8, whiteSpace:'pre-wrap', fontFamily:"'Courier New', Courier, monospace", margin:0 }}>{brief.source_case}</pre>
            </div>
            <div style={{ background:'#1e2a1e', border:'1px solid #166534', borderRadius:8, padding:'10px 14px', display:'flex', gap:10, alignItems:'flex-start' }}>
              <span style={{ fontSize:16, flexShrink:0 }}>↓</span>
              <div>
                <p style={{ fontSize:12, fontWeight:600, color:'#22c55e', marginBottom:2 }}>Vigio extracted and structured this case in {brief.audit_trail[0].note.match(/[\d.]+s/)?.[0] || '~40s'}</p>
                <p style={{ fontSize:11, color:'#4ade80' }}>Switch to the Summary tab to see the generated Case Intelligence Brief →</p>
              </div>
            </div>
          </div>
        )}

        {tab === 'summary' && (
          <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
            <SectionTitle>Executive Summary</SectionTitle>
            <p style={{ fontSize:13, color:'#94a3b8', lineHeight:1.75 }}>{brief.executive_summary}</p>

            <SectionTitle>Three Lenses at a Glance</SectionTitle>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:8 }}>
              {[
                ['Regulatory Safety', `${r.seriousness} · ${r.expectedness}`, r.expectedness?.startsWith('Unknown') ? 'Trigger pending label check' : r.reporting_trigger, 'regulatory'],
                ['Clinical Safety', `Causality: ${c.causality?.category || 'Not assessed'}`, `${c.follow_up_questions?.length || 0} follow-up questions`, 'clinical'],
                ['Population & Evidence', p.faers_signal ? `${p.faers_signal.signal_strength}${p.illustrative ? ' (placeholder)' : ''}` : 'No FAERS data', `${p.evidence_gaps?.length || 0} evidence gaps`, 'population'],
              ].map(([t,l1,l2,id]) => (
                <div key={t} onClick={() => setTab(id)} style={{ background:'#1e293b', borderRadius:8, padding:'10px 12px', cursor:'pointer', border:'1px solid #334155' }}>
                  <p style={{ fontSize:10, fontWeight:700, color:'#60a5fa', textTransform:'uppercase', letterSpacing:'0.5px', marginBottom:4 }}>{t}</p>
                  <p style={{ fontSize:12, color:'#e2e8f0', lineHeight:1.45 }}>{l1}</p>
                  <p style={{ fontSize:11, color:'#94a3b8', marginTop:2 }}>{l2}</p>
                </div>
              ))}
            </div>

            <SectionTitle>ICH E2A Four Elements</SectionTitle>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8 }}>
              {[['Patient', e.patient||'—'], ['Reporter', e.reporter ? `${e.reporter}${e.reporter_type?` (${e.reporter_type})`:''}`:'—'], ['Suspect Product', e.suspect_product||'—'], ['Adverse Event', e.adverse_event||'—']].map(([l,v]) => (
                <Card key={l}>
                  <p style={{ fontSize:10, color:'#64748b', textTransform:'uppercase', letterSpacing:'0.5px', marginBottom:4 }}>{l}</p>
                  <p style={{ fontSize:12, fontWeight:500, color:'#e2e8f0', lineHeight:1.5 }}>{v}</p>
                </Card>
              ))}
            </div>

            <div style={{ background: e.four_element_valid?'#14532d22':'#450a0a', border:`1px solid ${e.four_element_valid?'#166534':'#7f1d1d'}`, borderRadius:6, padding:'8px 14px', fontSize:13, color: e.four_element_valid?'#86efac':'#fca5a5' }}>
              {e.four_element_valid ? '✓ Four-element valid (ICH E2A)' : `✗ Incomplete — missing: ${e.missing_elements?.join(', ')}`}
            </div>

            {brief.key_uncertainties?.length > 0 && (
              <>
                <SectionTitle>Key Uncertainties</SectionTitle>
                <ul style={{ paddingLeft:18, display:'flex', flexDirection:'column', gap:6 }}>
                  {brief.key_uncertainties.map((u,i) => <li key={i} style={{ fontSize:13, color:'#94a3b8', lineHeight:1.65 }}>{u}</li>)}
                </ul>
              </>
            )}

            {!isDemo && (
              <div style={{ display:'flex', gap:8, marginTop:4 }}>
                <a href={`/api/export/${brief.case_id}?format=json`} target="_blank" style={{ background:'#1e293b', border:'1px solid #334155', borderRadius:6, padding:'6px 14px', fontSize:13, textDecoration:'none' }}>Export JSON</a>
                <a href={`/api/export/${brief.case_id}?format=e2b`} target="_blank" style={{ background:'#1e293b', border:'1px solid #334155', borderRadius:6, padding:'6px 14px', fontSize:13, textDecoration:'none' }}>Export E2B Stub</a>
              </div>
            )}
            {isDemo && (
              <p style={{ fontSize:11, color:'#334155', fontStyle:'italic' }}>Export available when connected to the Vigio backend.</p>
            )}
          </div>
        )}

        {tab === 'regulatory' && (
          <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
            <LensHeader n="1" title="Regulatory Safety" question="Is the case valid, serious, listed or expected, and reportable?" />
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8 }}>
              {[['Validity',r.validity_status],['Seriousness',r.seriousness],['Expectedness / Listedness',r.expectedness],['Reporting Trigger', r.expectedness?.startsWith('Unknown') ? 'Pending label check' : r.reporting_trigger]].map(([l,v]) => (
                <Card key={l}>
                  <Label>{l}</Label>
                  <p style={{ fontSize:12, fontWeight:500, color:'#e2e8f0' }}>{v}</p>
                </Card>
              ))}
            </div>

            {(r.label_source || r.reporting_context) && (
              <Card style={{ display:'flex', flexDirection:'column', gap:6 }}>
                {r.reporting_context && <p style={{ fontSize:12, color:'#94a3b8' }}><strong style={{ color:'#cbd5e1' }}>Reporting context:</strong> {r.reporting_context}</p>}
                {r.label_source && <p style={{ fontSize:12, color: r.expectedness?.startsWith('Unknown') ? '#fbbf24' : '#94a3b8' }}><strong style={{ color:'#cbd5e1' }}>Reference label:</strong> {r.label_source}</p>}
              </Card>
            )}

            {r.seriousness_criteria_met?.length > 0 && <>
              <SectionTitle>Seriousness Criteria Met</SectionTitle>
              <ul style={{ paddingLeft:18, display:'flex', flexDirection:'column', gap:6 }}>
                {r.seriousness_criteria_met.map((x,i) => <li key={i} style={{ fontSize:13, color:'#94a3b8', lineHeight:1.6 }}>{x}</li>)}
              </ul>
            </>}

            {r.expectedness_basis && <><SectionTitle>Expectedness Basis</SectionTitle><Para>{r.expectedness_basis}</Para></>}
            {r.reportability_causality && <><SectionTitle>Reasonable Possibility (for reporting)</SectionTitle><Para>{r.reportability_causality}</Para></>}
            {r.reporting_trigger_rationale && <><SectionTitle>Trigger Rationale</SectionTitle><Para>{r.reporting_trigger_rationale}</Para></>}
            {r.day_zero && <><SectionTitle>Day 0</SectionTitle><p style={{ fontSize:13, fontFamily:'monospace', color:'#94a3b8' }}>{r.day_zero}</p></>}
            {r.regulatory_notes && <><SectionTitle>Regulatory Notes</SectionTitle><Para>{r.regulatory_notes}</Para></>}

            <SectionTitle>Citations</SectionTitle>
            <ul style={{ paddingLeft:18, display:'flex', flexDirection:'column', gap:5 }}>
              {r.citations?.map((x,i) => <li key={i} style={{ fontSize:12, color:'#64748b', lineHeight:1.6 }}>{x}</li>)}
            </ul>
            <RoadmapNote items={['Aggregate reports (PBRER, DSUR)', 'Labeling and regulatory commitments tracking']} />
          </div>
        )}

        {tab === 'clinical' && (
          <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
            <LensHeader n="2" title="Clinical Safety" question="What happened to the patient, and how plausible is a link to the product?" />

            {c.case_clinical_summary && <><SectionTitle>Case-Level Clinical Assessment</SectionTitle><Para>{c.case_clinical_summary}</Para></>}

            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8 }}>
              {[['Time to Onset', e.time_to_onset], ['Dose / Exposure', e.dose_exposure], ['Dechallenge', e.dechallenge], ['Rechallenge', e.rechallenge]].map(([l,v]) => (
                <Card key={l}>
                  <Label>{l}</Label>
                  <p style={{ fontSize:12, color:'#e2e8f0', lineHeight:1.5 }}>{v || 'Not stated'}</p>
                </Card>
              ))}
            </div>

            {[['Time-to-onset assessment', c.time_to_onset_assessment], ['Dose / exposure assessment', c.dose_exposure_assessment], ['Dechallenge / rechallenge assessment', c.dechallenge_rechallenge_assessment]].filter(([,v]) => v).map(([l,v]) => (
              <div key={l}><SectionTitle>{l}</SectionTitle><Para>{v}</Para></div>
            ))}

            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8 }}>
              <Card>
                <Label>Risk Factors</Label>
                <ul style={{ paddingLeft:16 }}>{(c.risk_factors||[]).map((x,i) => <li key={i} style={{ fontSize:12, color:'#cbd5e1', lineHeight:1.6 }}>{x}</li>)}</ul>
              </Card>
              <Card>
                <Label>Alternative Causes</Label>
                <ul style={{ paddingLeft:16 }}>{(c.alternative_causes||[]).map((x,i) => <li key={i} style={{ fontSize:12, color:'#cbd5e1', lineHeight:1.6 }}>{x}</li>)}</ul>
              </Card>
            </div>
            {(e.medical_history?.length > 0 || e.concomitant_medications?.length > 0) && (
              <p style={{ fontSize:12, color:'#64748b', lineHeight:1.6 }}>
                <strong style={{ color:'#94a3b8' }}>History:</strong> {(e.medical_history||[]).join('; ') || 'not stated'}<br/>
                <strong style={{ color:'#94a3b8' }}>Concomitant medications:</strong> {(e.concomitant_medications||[]).join('; ') || 'not stated'}
              </p>
            )}

            {c.causality && (
              <div style={{ background:'#172554', border:'1px solid #1d4ed8', borderRadius:8, padding:'12px 16px', display:'flex', flexDirection:'column', gap:8 }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', gap:10 }}>
                  <div>

                  <div style={{ textAlign:'right' }}>

                <p style={{ fontSize:13, color:'#cbd5e1', lineHeight:1.7 }}>{c.causality.rationale}</p>

                  </div>
                )}
              </div>
            )}

            {c.follow_up_questions?.length > 0 && <>
              <SectionTitle>Follow-Up Questions for the Reporter</SectionTitle>
              <ol style={{ paddingLeft:20, display:'flex', flexDirection:'column', gap:5 }}>
                {c.follow_up_questions.map((q,i) => <li key={i} style={{ fontSize:13, color:'#94a3b8', lineHeight:1.6 }}>{q}</li>)}
              </ol>

            <SectionTitle>Mechanism and Plausibility · {c.clinical_plausibility || 'Unknown'}</SectionTitle>
            <Para>{c.mechanistic_summary}</Para>
            {c.label_cross_reference && <p style={{ fontSize:12, color:'#64748b', lineHeight:1.6, fontStyle:'italic' }}>{c.label_cross_reference}</p>}

            <SectionTitle>Literature ({c.pubmed_references?.length || 0})</SectionTitle>
            {c.pubmed_references?.length > 0 ? c.pubmed_references.map((ref,i) => (
              <Card key={ref.pmid || i} style={{ display:'flex', flexDirection:'column', gap:5 }}>

/* ─── Drug Safety Search ───────────────────────────────────────────────── */
/* Uses the backend FAERS database when it is running (every drug, with breakdowns);
   otherwise the compact extract embedded in this page (window.FAERS_EXTRACT). */

const SDR_MIN = 3, ROR_STRONG = 5, ROR_MODERATE = 2;
const SALTS = new Set(['SODIUM','POTASSIUM','CALCIUM','HYDROCHLORIDE','HCL','DIHYDROCHLORIDE','HYDROBROMIDE','OXALATE','MESYLATE','MALEATE','SULFATE','SULPHATE','CITRATE','TARTRATE','BITARTRATE','ACETATE','BESYLATE','FUMARATE','SUCCINATE','PHOSPHATE','BROMIDE','PAMOATE','PROPANEDIOL','MONOHYDRATE','DIHYDRATE','HYDRATE','ANHYDROUS','MAGNESIUM','CHLORIDE']);
const normDrug = (t) => {
  const w = (t || '').toUpperCase().replace(/[^A-Z0-9 \-]/g, ' ').split(/\s+/).filter(Boolean);
  const s = w.filter(x => !SALTS.has(x));
  return (s.length ? s : w).join(' ');
};

function signalRow(a, drugTotal, eventTotal, N) {
  const b = drugTotal - a, c = eventTotal - a, d = N - a - b - c;
  let ror = null, lo = null, hi = null;
  if (Math.min(a, b, c, d) > 0) {
    const r = (a / b) / (c / d), se = Math.sqrt(1/a + 1/b + 1/c + 1/d);
    ror = +r.toFixed(2); lo = +Math.exp(Math.log(r) - 1.96 * se).toFixed(2); hi = +Math.exp(Math.log(r) + 1.96 * se).toFixed(2);
  }
  let is_sdr = false, strength;
  if (a < SDR_MIN) strength = `Insufficient data (fewer than ${SDR_MIN} reports)`;
  else if (ror == null) strength = 'Unable to calculate';
  else if (lo <= 1) strength = 'No disproportionate reporting (CI includes 1)';
  else { is_sdr = true; strength = ror >= ROR_STRONG ? `Strong (ROR ≥ ${ROR_STRONG})` : ror >= ROR_MODERATE ? `Moderate (ROR ${ROR_MODERATE}–${ROR_STRONG})` : `Weak (ROR < ${ROR_MODERATE})`; }
  const confidence = a >= 100 ? 'High' : a >= 20 ? 'Moderate' : 'Low';
  return { reports: a, event_total: eventTotal, ror, ci_lower: lo, ci_upper: hi, is_sdr, strength, confidence };
}

const extractSource = {
  mode: 'extract',
  ok: () => !!window.FAERS_EXTRACT,
  resolve(text) {
    const X = window.FAERS_EXTRACT, q = normDrug(text);
    if (X.drugs[q]) return q;
    if (X.names[q]) return X.names[q];
    const first = q.split(' ')[0];
    return X.drugs[first] ? first : (X.names[first] || null);
  },
  async suggest(text) {
    const X = window.FAERS_EXTRACT, q = normDrug(text);
    if (q.length < 2) return [];
    const res = new Map();
    for (const [ing, d] of Object.entries(X.drugs)) if (ing.includes(q)) res.set(ing, { ingredient: ing, label: ing, reports: d.n, prefix: ing.startsWith(q) });
    for (const [name, ing] of Object.entries(X.names)) if (name.includes(q) && !res.has(ing)) res.set(ing, { ingredient: ing, label: `${name} (${ing})`, reports: X.drugs[ing].n, prefix: name.startsWith(q) });
    return [...res.values()].sort((a, b) => (b.prefix - a.prefix) || (b.reports - a.reports)).slice(0, 10);
  },
  async profile(text, { sort, signalsOnly, minReports }) {
    const X = window.FAERS_EXTRACT, ing = this.resolve(text);
    if (!ing) return { found: false, query: text };
    const d = X.drugs[ing];
    let events = d.e.map(([i, a]) => ({ pt: X.pts[i], ...signalRow(a, d.n, X.et[i], X.N) }));
    events = events.filter(e => e.reports >= minReports && (!signalsOnly || e.is_sdr));
    events.sort(sort === 'ror' ? (a, b) => (b.ci_lower || 0) - (a.ci_lower || 0) : (a, b) => b.reports - a.reports);
    return { found: true, ingredient: ing, total_reports: d.n, distinct_events: d.k, signals: d.s ?? null,
             events, events_matching: events.length, data_period: X.period, database_total_reports: X.N,
             source: `FAERS ${X.period}, deduplicated, suspect drugs only (demo extract)`, partial: true };
  },
  async pair() { return null; },
};

const apiSource = {
  mode: 'live',
  async suggest(text) {
    const r = await fetch(`${BASE}/api/faers/drugs?q=${encodeURIComponent(text)}`);
    return r.ok ? (await r.json()).results : [];
  },
  async profile(text, { sort, signalsOnly, minReports }) {
    const p = new URLSearchParams({ drug: text, sort, signals_only: signalsOnly, min_reports: minReports, limit: 200 });
    const r = await fetch(`${BASE}/api/faers/drug?${p}`);
    if (!r.ok) throw new Error(`Search failed (${r.status})`);
    return r.json();
  },
  async pair(text, pt) {
    const r = await fetch(`${BASE}/api/faers/pair?drug=${encodeURIComponent(text)}&event=${encodeURIComponent(pt)}`);
    return r.ok ? r.json() : null;
  },
};

async function detectSearchSource() {
  try {
    if (location.protocol.startsWith('http')) {
      const r = await fetch(`${BASE}/api/faers/status`);
      if (r.ok && (await r.json()).local_snapshot) return apiSource;
    }
  } catch (e) { /* no backend: fall back to the embedded extract */ }
  return extractSource.ok() ? extractSource : null;
}

const strengthColor = (row) => !row.is_sdr ? '#64748b' : row.ror >= ROR_STRONG ? '#f87171' : row.ror >= ROR_MODERATE ? '#fbbf24' : '#a3e635';
const fmtCI = (r) => r.ror == null ? '—' : `${r.ror.toFixed(2)} (${r.ci_lower}–${r.ci_upper})`;
const listCounts = (obj) => Object.entries(obj || {}).map(([k, v]) => `${k} ${v.toLocaleString()}`).join(' · ') || '—';

function DrugSearch() {
  const [source, setSource] = useState(undefined);
  const [query, setQuery] = useState('');
  const [suggestions, setSuggestions] = useState([]);
  const [showSug, setShowSug] = useState(false);
  const [drug, setDrug] = useState(null);
  const [opts, setOpts] = useState({ sort: 'reports', signalsOnly: false, minReports: 1 });
  const [eventFilter, setEventFilter] = useState('');
  const [profile, setProfile] = useState(null);
  const [selected, setSelected] = useState(null);
  const [detail, setDetail] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);

  useEffect(() => { detectSearchSource().then(setSource); }, []);

  useEffect(() => {
    if (!source || query.trim().length < 2) { setSuggestions([]); return; }
    const t = setTimeout(() => source.suggest(query).then(setSuggestions).catch(() => setSuggestions([])), 180);
    return () => clearTimeout(t);
  }, [query, source]);

  useEffect(() => {
    if (!source || !drug) return;
    setBusy(true); setErr(null);
    source.profile(drug, opts).then(p => { setProfile(p); }).catch(e => setErr(e.message)).finally(() => setBusy(false));
  }, [drug, opts, source]);

  useEffect(() => {
    setDetail(null);
    if (!selected || !source) return;
    source.pair(drug, selected.pt).then(setDetail).catch(() => setDetail(null));
  }, [selected]);

  const choose = (value) => { setDrug(value); setQuery(value); setShowSug(false); setSelected(null); setEventFilter(''); };

  if (source === undefined) return <div style={{ padding:32, color:'#64748b' }}>Loading FAERS data…</div>;
  if (source === null) return <div style={{ padding:32, color:'#fca5a5' }}>No FAERS data available. Start the backend with the FAERS database, or rebuild this page with tools/export_search_extract.py.</div>;

  const X = window.FAERS_EXTRACT;
  const rows = (profile?.events || []).filter(e => !eventFilter || e.pt.includes(eventFilter.toUpperCase()));
  const examples = ['Keytruda', 'Warfarin', 'Metformin', 'Dupilumab', 'Semaglutide'];

  return (
    <div style={{ flex:1, overflowY:'auto', padding:'24px 28px', display:'flex', flexDirection:'column', gap:16 }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:16 }}>
        <div>
          <p style={{ fontSize:11, fontWeight:700, color:'#60a5fa', textTransform:'uppercase', letterSpacing:'0.6px' }}>Drug Safety Search · Population Safety lens</p>
          <p style={{ fontSize:20, fontWeight:600, color:'#e2e8f0', marginTop:4 }}>Search any drug's FAERS safety profile</p>
        </div>
        <span style={{ fontSize:11, color: source.mode === 'live' ? '#4ade80' : '#fbbf24', background:'#0f172a', border:`1px solid ${source.mode === 'live' ? '#166534' : '#a16207'}`, padding:'4px 10px', borderRadius:6, whiteSpace:'nowrap' }}>
          {source.mode === 'live' ? 'Live database · all drugs' : `Top ${Object.keys(X.drugs).length.toLocaleString()} drugs · FAERS ${X.period}`}
        </span>
      </div>

      <div style={{ position:'relative' }}>
        <input value={query} placeholder="Type a drug or brand name, e.g. Keytruda, warfarin, Ozempic…"
          onChange={e => { setQuery(e.target.value); setSuggestions([]); setShowSug(true); }}
          onFocus={() => setShowSug(true)}
          onKeyDown={e => { if (e.key === 'Enter' && query.trim()) { const qn = normDrug(query); const pick = suggestions.find(s => s.label.includes(qn)); choose(pick?.ingredient || query.trim()); } }}
          style={{ width:'100%', background:'#1e293b', border:'1px solid #334155', borderRadius:8, padding:'12px 14px', color:'#e2e8f0', fontSize:15, outline:'none' }} />
        {showSug && suggestions.length > 0 && (
          <div style={{ position:'absolute', top:'100%', left:0, right:0, background:'#0f172a', border:'1px solid #334155', borderRadius:8, marginTop:4, zIndex:10, maxHeight:320, overflowY:'auto' }}>
            {suggestions.map(s => (
              <div key={s.label} onMouseDown={() => choose(s.ingredient)} style={{ padding:'9px 14px', cursor:'pointer', display:'flex', justifyContent:'space-between', borderBottom:'1px solid #1e293b' }}>
                <span style={{ fontSize:13, color:'#e2e8f0' }}>{s.label}</span>
                <span style={{ fontSize:12, color:'#64748b' }}>{s.reports.toLocaleString()} reports</span>
              </div>
            ))}
          </div>

      {!drug && (
        <div style={{ display:'flex', gap:8, flexWrap:'wrap', alignItems:'center' }}>

      {busy && <p style={{ fontSize:13, color:'#64748b' }}>Searching…</p>}

            <div style={{ background:'#172554', border:'1px solid #1d4ed8', borderRadius:8, padding:'12px 16px', display:'flex', flexDirection:'column', gap:6 }}>

              <p style={{ fontSize:13, color:'#cbd5e1' }}>

              <p style={{ fontSize:13, color:'#cbd5e1' }}>ROR {fmtCI(selected)} · <span style={{ color: strengthColor(selected) }}>{selected.strength}</span> · data confidence {selected.confidence}</p>
              {detail?.found && detail.pt && (
                <>
                  <p style={{ fontSize:12, color:'#94a3b8' }}>Sex: {listCounts(detail.by_sex)}</p>
                  <p style={{ fontSize:12, color:'#94a3b8' }}>Age group: {listCounts(detail.by_age_group)}</p>
                  <p style={{ fontSize:12, color:'#94a3b8' }}>Outcomes: {listCounts(detail.outcomes)}</p>

            </div>
          )}

          <div style={{ display:'flex', gap:10, alignItems:'center', flexWrap:'wrap' }}>
            <select value={opts.sort} onChange={e => setOpts({ ...opts, sort: e.target.value })} style={{ background:'#1e293b', border:'1px solid #334155', borderRadius:6, padding:'6px 10px', color:'#e2e8f0', fontSize:12 }}>
              <option value="reports">Sort: most reported</option>
              <option value="ror">Sort: strongest signal (CI lower bound)</option>
            </select>
            <label style={{ fontSize:12, color:'#94a3b8', display:'flex', alignItems:'center', gap:6 }}>
              <input type="checkbox" checked={opts.signalsOnly} onChange={e => setOpts({ ...opts, signalsOnly: e.target.checked })} /> Signals only
            </label>
            <label style={{ fontSize:12, color:'#94a3b8', display:'flex', alignItems:'center', gap:6 }}>
              Min reports
              <select value={opts.minReports} onChange={e => setOpts({ ...opts, minReports: +e.target.value })} style={{ background:'#1e293b', border:'1px solid #334155', borderRadius:6, padding:'4px 8px', color:'#e2e8f0', fontSize:12 }}>
                {[1, 3, 5, 10, 20, 50].map(n => <option key={n} value={n}>{n}</option>)}
              </select>
            </label>
            <input value={eventFilter} onChange={e => setEventFilter(e.target.value)} placeholder="Filter events…" style={{ background:'#1e293b', border:'1px solid #334155', borderRadius:6, padding:'6px 10px', color:'#e2e8f0', fontSize:12, outline:'none', flex:1, minWidth:160 }} />
          </div>

          <div style={{ border:'1px solid #1e293b', borderRadius:8, overflow:'hidden' }}>
            <div style={{ display:'grid', gridTemplateColumns:'2.4fr 0.8fr 1.4fr 1.6fr 0.8fr', background:'#0f172a', padding:'8px 12px', fontSize:10, fontWeight:700, color:'#64748b', textTransform:'uppercase', letterSpacing:'0.5px' }}>
              <span>Event (MedDRA PT)</span><span>Reports</span><span>ROR (95% CI)</span><span>Signal</span><span>Confidence</span>
            </div>
            {rows.length === 0 && <p style={{ padding:'14px 12px', fontSize:13, color:'#64748b' }}>No events match these filters.</p>}
            {rows.slice(0, 200).map(r => (
              <div key={r.pt} onClick={() => setSelected(r)} style={{ display:'grid', gridTemplateColumns:'2.4fr 0.8fr 1.4fr 1.6fr 0.8fr', padding:'8px 12px', fontSize:12, color:'#cbd5e1', borderTop:'1px solid #1e293b', cursor:'pointer', background: selected?.pt === r.pt ? '#1e293b' : 'transparent' }}>
                <span style={{ color:'#e2e8f0' }}>{r.pt}</span>
                <span>{r.reports.toLocaleString()}</span>
                <span>{fmtCI(r)}</span>
                <span style={{ color: strengthColor(r) }}>{r.is_sdr ? r.strength : r.strength.split(' (')[0]}</span>
                <span>{r.confidence}</span>
              </div>
            ))}
          </div>
          <p style={{ fontSize:11, color:'#475569', lineHeight:1.6 }}>
            Source: {profile.source}. {profile.partial ? `${window.FAERS_EXTRACT.note} ` : ''}
            A signal of disproportionate reporting needs at least {SDR_MIN} reports and a 95% CI lower bound above 1.
            FAERS is voluntary and has no exposure denominator: disproportionality shows reporting patterns, not incidence or causality. Well-known effects often show very high RORs, and events tied to the treated disease (such as disease progression) can appear as signals because of confounding by indication.
          </p>
        </>
      )}
    </div>
  );
}

/* ─── App ──────────────────────────────────────────────────────────────── */
function App() {
  const [appState, setAppState] = useState('idle'); // idle | processing | complete | error | search | about
  const [caseId, setCaseId] = useState(null);
  const [status, setStatus] = useState(null);
  const [brief, setBrief] = useState(null);
  const [isDemo, setIsDemo] = useState(false);
  const [confirmations, setConfirmations] = useState({});
  const pollRef = useRef(null);

  const stopPoll = () => { if (pollRef.current) { clearInterval(pollRef.current); pollRef.current = null; } };

  const handleCaseStarted = (id) => { setIsDemo(false); setCaseId(id); setAppState('processing'); };

  const handleDemoSelected = (demo) => {
    stopPoll();
    setIsDemo(true);
    setBrief(demo.brief);
    setAppState('complete');
  };

  useEffect(() => {
    if (appState !== 'processing' || !caseId) return;
    pollRef.current = setInterval(async () => {
      try {
        const s = await pollStatus(caseId);
        setStatus(s);
        if (s.status === 'complete') {
          stopPoll();
          const b = await getBrief(caseId);
          setBrief(b);
          setAppState('complete');
        } else if (s.status === 'error') {
          stopPoll();
          setAppState('error');
        }
      } catch(e) { console.error('poll error', e); }
    }, 2000);
    return stopPoll;
  }, [appState, caseId]);

  const reset = () => { stopPoll(); setAppState('idle'); setCaseId(null); setStatus(null); setBrief(null); setIsDemo(false); };
  const view = appState === 'search' ? 'search' : appState === 'about' ? 'about' : (appState === 'complete' || appState === 'processing') ? 'inbox' : 'inbox';
  const openFirst = () => {
    const firstOpen = DEMO_CASES.find(d => !confirmations[d.brief.case_id] && d.brief.regulatory.expectedness?.startsWith('Unknown')) || DEMO_CASES[0];
    handleDemoSelected(firstOpen);
  };

  return (
    <div style={{ display:'flex', height:'100vh', overflow:'hidden' }}>
      {/* Left */}
      <div style={{ width:312, flexShrink:0, borderRight:'1px solid #1e293b', background:'#0b111c', display:'flex', flexDirection:'column' }}>
        <Sidebar view={view} activeCaseId={appState === 'complete' && brief ? brief.case_id : null} confirmations={confirmations}
          onSelectCase={handleDemoSelected}
          onSearch={() => { stopPoll(); setAppState('search'); }}
          onAbout={() => { stopPoll(); setAppState('about'); }}
          onCaseStarted={handleCaseStarted} />
      </div>

      {/* Right */}
      <div style={{ flex:1, background:'#0a0f1a', display:'flex', flexDirection:'column', overflow:'hidden' }}>
        {appState === 'idle' && <EmptyState onOpenFirst={openFirst} onSearch={() => setAppState('search')} />}

        {appState === 'processing' && <ProgressTracker status={status} />}

        {appState === 'search' && <DrugSearch />}

        {appState === 'about' && <AboutView />}

        {appState === 'complete' && brief && (
          <BriefViewer brief={brief} isDemo={isDemo} existingConfirmation={confirmations[brief.case_id]}
            onConfirmed={(id, conf) => setConfirmations(c => ({ ...c, [id]: conf }))} />
        )}

        {appState === 'error' && (
          <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:12, padding:48 }}>
            <p style={{ fontSize:18, fontWeight:600, color:'#ef4444' }}>Analysis failed</p>
            <p style={{ fontSize:13, color:'#94a3b8', textAlign:'center', maxWidth:400 }}>{status?.error || 'Unknown error'}</p>
            <button onClick={reset} style={{ background:'#1e293b', color:'#e2e8f0', border:'1px solid #334155', borderRadius:6, padding:'8px 20px', fontSize:14, cursor:'pointer', marginTop:8 }}>Back</button>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

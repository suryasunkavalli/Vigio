/* ─── API helpers ─────────────────────────────────────────────────────── */
const BASE = '';

async function uploadPDF(file) {
  const form = new FormData();
  form.append('file', file);
  const r = await fetch(`${BASE}/api/upload`, { method: 'POST', body: form });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function startAnalysis(caseId) {
  const r = await fetch(`${BASE}/api/analyze?case_id=${caseId}`, { method: 'POST' });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function pollStatus(caseId) {
  const r = await fetch(`${BASE}/api/status/${caseId}`);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function getBrief(caseId) {
  const r = await fetch(`${BASE}/api/brief/${caseId}`);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function confirmBrief(caseId, name, decision, notes) {
  const p = new URLSearchParams({ reviewer_name: name, reviewer_decision: decision });
  if (notes) p.set('reviewer_notes', notes);
  const r = await fetch(`${BASE}/api/confirm/${caseId}?${p}`, { method: 'POST' });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

/* ─── Upload Panel ────────────────────────────────────────────────────── */
function UploadPanel({ onCaseStarted, onDemoSelected }) {
  const [dragging, setDragging] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const inputRef = useRef();

  const handle = async (file) => {
    if (!file?.name.toLowerCase().endsWith('.pdf')) { setErr('Please upload a PDF'); return; }
    setErr(null); setBusy(true);
    try {
      const { case_id } = await uploadPDF(file);
      await startAnalysis(case_id);
      onCaseStarted(case_id);
    } catch(e) { setErr(e.message || 'Upload failed'); } finally { setBusy(false); }
  };

  return (
    <div style={{ display:'flex', flexDirection:'column', gap:16, padding:'24px 20px', height:'100%', overflowY:'auto' }}>
      {/* Logo */}
      <div style={{ paddingBottom: 4 }}>
        <div style={{ fontSize:26, fontWeight:800, color:'#60a5fa', letterSpacing:'-0.5px' }}>Vigio</div>
        <div style={{ fontSize:11, color:'#475569', textTransform:'uppercase', letterSpacing:'0.8px' }}>Case Intelligence Platform</div>
      </div>

      {/* Demo cases section */}
      <div style={{ background:'#0d1829', border:'1px solid #1e293b', borderRadius:10, padding:'12px 14px' }}>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:10 }}>
          <p style={{ fontSize:11, fontWeight:700, color:'#60a5fa', textTransform:'uppercase', letterSpacing:'0.6px' }}>
            Demo Cases
          </p>
          <span style={{ fontSize:10, color:'#334155', background:'#1e293b', padding:'2px 8px', borderRadius:4, fontWeight:600 }}>
            No backend required
          </span>
        </div>
        <p style={{ fontSize:11, color:'#475569', marginBottom:10, lineHeight:1.5 }}>
          Click any case to instantly view a pre-computed Intelligence Brief.
        </p>
        <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
          {DEMO_CASES.map(demo => (
            <DemoCaseCard key={demo.id} demo={demo} onClick={onDemoSelected} />
          ))}

      </div>

      {/* Divider */}
      <div style={{ display:'flex', alignItems:'center', gap:10 }}>
        <div style={{ flex:1, height:1, background:'#1e293b' }} />

        <div style={{ flex:1, height:1, background:'#1e293b' }} />

      <div

        style={{

          borderRadius: 10,
          background: dragging ? '#1e3a5f' : '#0d1117',
          padding: '28px 16px',
          textAlign: 'center',

          transition: 'all 0.2s',
          flexShrink: 0,
        }}
      >
        <input ref={inputRef} type="file" accept=".pdf" hidden onChange={e => handle(e.target.files?.[0])} />
        {busy ? (
          <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:12 }}>
            <div style={{ width:28, height:28, border:'3px solid #1e293b', borderTop:'3px solid #60a5fa', borderRadius:'50%', animation:'spin 1s linear infinite' }} />

  const e = brief.entities;
  const r = brief.regulatory;
  const c = brief.clinical;
  const p = brief.population;
  const tColor = TRIGGER_COLOR[r.reporting_trigger] || '#64748b';
  const aColor = ACTION_COLOR[brief.recommended_action] || '#64748b';

    if (!name || !decision) return;
    setConfirming(true);

        setLocalConfirmation({ reviewer_name: name, reviewer_decision: decision, reviewer_notes: notes, confirmed_at: new Date().toISOString() });

        {tab === 'source' && (
          <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
              <SectionTitle>Original Source Case</SectionTitle>
              <span style={{ fontSize:10, color:'#475569', background:'#1e293b', border:'1px solid #334155', padding:'3px 8px', borderRadius:4, fontFamily:'monospace' }}>{brief.source_pdf_filename}</span>
            </div>
            <div style={{ background:'#0a0f1a', border:'1px solid #1e3a5f', borderRadius:8, padding:'16px 18px' }}>
              <p style={{ fontSize:11, color:'#3b82f6', textTransform:'uppercase', letterSpacing:'0.5px', marginBottom:12, fontWeight:600 }}>Raw ICSR — as received before Vigio processing</p>
              <pre style={{ fontSize:12, color:'#94a3b8', lineHeight:1.8, whiteSpace:'pre-wrap', fontFamily:"'Courier New', Courier, monospace", margin:0 }}>{brief.source_case}</pre>
            </div>
            <div style={{ background:'#1e2a1e', border:'1px solid #166534', borderRadius:8, padding:'10px 14px', display:'flex', gap:10, alignItems:'flex-start' }}>
              <span style={{ fontSize:16, flexShrink:0 }}>↓</span>
              <div>
                <p style={{ fontSize:12, fontWeight:600, color:'#22c55e', marginBottom:2 }}>Vigio extracted and structured this case in {brief.audit_trail[0].note.match(/[\d.]+s/)?.[0] || '~40s'}</p>
                <p style={{ fontSize:11, color:'#4ade80' }}>Switch to the Summary tab to see the generated Case Intelligence Brief →</p>
              </div>
            </div>
          </div>
        )}

        {tab === 'summary' && (
          <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
            <SectionTitle>Executive Summary</SectionTitle>
            <p style={{ fontSize:13, color:'#94a3b8', lineHeight:1.75 }}>{brief.executive_summary}</p>

            <SectionTitle>ICH E2A Four Elements</SectionTitle>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8 }}>
              {[['Patient', e.patient||'—'], ['Reporter', e.reporter ? `${e.reporter}${e.reporter_type?` (${e.reporter_type})`:''}`:'—'], ['Suspect Product', e.suspect_product||'—'], ['Adverse Event', e.adverse_event||'—']].map(([l,v]) => (
                <Card key={l}>
                  <p style={{ fontSize:10, color:'#64748b', textTransform:'uppercase', letterSpacing:'0.5px', marginBottom:4 }}>{l}</p>
                  <p style={{ fontSize:12, fontWeight:500, color:'#e2e8f0', lineHeight:1.5 }}>{v}</p>
                </Card>
              ))}
            </div>

            <div style={{ background: e.four_element_valid?'#14532d22':'#450a0a', border:`1px solid ${e.four_element_valid?'#166534':'#7f1d1d'}`, borderRadius:6, padding:'8px 14px', fontSize:13, color: e.four_element_valid?'#86efac':'#fca5a5' }}>
              {e.four_element_valid ? '✓ Four-element valid (ICH E2A)' : `✗ Incomplete — missing: ${e.missing_elements?.join(', ')}`}
            </div>

            {brief.key_uncertainties?.length > 0 && (
              <>
                <SectionTitle>Key Uncertainties</SectionTitle>
                <ul style={{ paddingLeft:18, display:'flex', flexDirection:'column', gap:6 }}>
                  {brief.key_uncertainties.map((u,i) => <li key={i} style={{ fontSize:13, color:'#94a3b8', lineHeight:1.65 }}>{u}</li>)}
                </ul>
              </>
            )}

            {!isDemo && (
              <div style={{ display:'flex', gap:8, marginTop:4 }}>
                <a href={`/api/export/${brief.case_id}?format=json`} target="_blank" style={{ background:'#1e293b', border:'1px solid #334155', borderRadius:6, padding:'6px 14px', fontSize:13, textDecoration:'none' }}>Export JSON</a>
                <a href={`/api/export/${brief.case_id}?format=e2b`} target="_blank" style={{ background:'#1e293b', border:'1px solid #334155', borderRadius:6, padding:'6px 14px', fontSize:13, textDecoration:'none' }}>Export E2B Stub</a>
              </div>
            )}
            {isDemo && (
              <p style={{ fontSize:11, color:'#334155', fontStyle:'italic' }}>Export available when connected to the Vigio backend.</p>
            )}
          </div>
        )}

        {tab === 'regulatory' && (
          <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
            <SectionTitle>Layer 1 — Regulatory Intelligence</SectionTitle>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8 }}>
              {[['Validity',r.validity_status],['Seriousness',r.seriousness],['Expectedness',r.expectedness],['Reporting Trigger',r.reporting_trigger]].map(([l,v]) => (
                <Card key={l}>
                  <p style={{ fontSize:10, color:'#64748b', textTransform:'uppercase', letterSpacing:'0.5px', marginBottom:4 }}>{l}</p>
                  <p style={{ fontSize:12, fontWeight:500, color:'#e2e8f0' }}>{v}</p>
                </Card>
              ))}
            </div>

            {r.seriousness_criteria_met?.length > 0 && <>
              <SectionTitle>21 CFR 312.32 Criteria Met</SectionTitle>
              <ul style={{ paddingLeft:18, display:'flex', flexDirection:'column', gap:6 }}>
                {r.seriousness_criteria_met.map((x,i) => <li key={i} style={{ fontSize:13, color:'#94a3b8', lineHeight:1.6 }}>{x}</li>)}
              </ul>
            </>}

            {r.reporting_trigger_rationale && <>
              <SectionTitle>Trigger Rationale</SectionTitle>
              <p style={{ fontSize:13, color:'#94a3b8', lineHeight:1.75 }}>{r.reporting_trigger_rationale}</p>
            </>}

            {r.expectedness_basis && <>
              <SectionTitle>Expectedness Basis</SectionTitle>
              <p style={{ fontSize:13, color:'#94a3b8', lineHeight:1.75 }}>{r.expectedness_basis}</p>
            </>}

            {r.day_zero && <>
              <SectionTitle>Day Zero (ICH E2A)</SectionTitle>
              <p style={{ fontSize:13, fontFamily:'monospace', color:'#94a3b8' }}>{r.day_zero}</p>
            </>}

            {r.regulatory_notes && <>
              <SectionTitle>Regulatory Notes</SectionTitle>
              <p style={{ fontSize:13, color:'#94a3b8', lineHeight:1.75 }}>{r.regulatory_notes}</p>
            </>}

            <SectionTitle>Citations</SectionTitle>
            <ul style={{ paddingLeft:18, display:'flex', flexDirection:'column', gap:5 }}>
              {r.citations?.map((x,i) => <li key={i} style={{ fontSize:12, color:'#64748b', lineHeight:1.6 }}>{x}</li>)}
            </ul>
          </div>
        )}

        {tab === 'clinical' && (
          <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
            <SectionTitle>Layer 2 — Clinical Intelligence</SectionTitle>
            <Card>
              <p style={{ fontSize:10, color:'#64748b', textTransform:'uppercase', letterSpacing:'0.5px', marginBottom:4 }}>Clinical Plausibility</p>
              <p style={{ fontSize:14, fontWeight:600, color:'#e2e8f0' }}>{c.clinical_plausibility || 'Unknown'}</p>
            </Card>

            <SectionTitle>Mechanistic Summary</SectionTitle>
            <p style={{ fontSize:13, color:'#94a3b8', lineHeight:1.75 }}>{c.mechanistic_summary}</p>

            {c.label_cross_reference && <>
              <SectionTitle>Label Cross-Reference</SectionTitle>
              <p style={{ fontSize:13, color:'#94a3b8', lineHeight:1.75 }}>{c.label_cross_reference}</p>
            </>}

            <SectionTitle>PubMed References ({c.pubmed_references?.length || 0})</SectionTitle>
            {c.pubmed_references?.length > 0 ? c.pubmed_references.map(ref => (
              <Card key={ref.pmid} style={{ display:'flex', flexDirection:'column', gap:5 }}>
                <a href={ref.url} target="_blank" style={{ fontSize:13, fontWeight:500, lineHeight:1.4 }}>{ref.title}</a>
                <p style={{ fontSize:11, color:'#64748b' }}>{ref.authors} · {ref.journal} · {ref.year} · PMID {ref.pmid}</p>
                <p style={{ fontSize:12, color:'#94a3b8', lineHeight:1.55 }}>{ref.relevance_summary}</p>
              </Card>
            )) : <p style={{ fontSize:13, color:'#475569' }}>No PubMed articles found.</p>}
          </div>
        )}

        {tab === 'population' && (
          <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
            <SectionTitle>Layer 3 — Population Intelligence</SectionTitle>
            {p.faers_signal && (() => {
              return (<>
                <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8 }}>
                  {[
                    ['Drug', p.faers_signal.drug_name],
                    ['Event', p.faers_signal.event_term],
                    ['FAERS Reports', p.faers_signal.report_count?.toLocaleString() ?? 'Unavailable'],
                    ['Total Drug Reports', p.faers_signal.total_drug_reports?.toLocaleString() ?? 'Unavailable'],
                    ['Query Status', p.faers_signal.query_status ?? (isDemo ? 'Demo dataset' : 'Unknown')],
                    ['ROR', 'Unavailable in MVP'],
                    ['Data Source', p.faers_signal.data_source],
                  ].map(([l,v]) => (
                    <Card key={l}>
                      <p style={{ fontSize:10, color:'#64748b', textTransform:'uppercase', letterSpacing:'0.5px', marginBottom:4 }}>{l}</p>
                      <p style={{ fontSize:12, fontWeight:500, color:'#e2e8f0' }}>{v}</p>
                    </Card>
                  ))}
                </div>
                {p.faers_signal.query_note && <p style={{ fontSize:12, color:'#64748b' }}>{p.faers_signal.query_note}</p>}
              </>);
            })()}
            <SectionTitle>Signal Summary</SectionTitle>
            <p style={{ fontSize:13, color:'#94a3b8', lineHeight:1.75 }}>{p.signal_summary}</p>
            {p.background_context && <>
              <SectionTitle>Background Context</SectionTitle>
              <p style={{ fontSize:13, color:'#94a3b8', lineHeight:1.75 }}>{p.background_context}</p>
            </>}
            {p.population_notes && <>
              <SectionTitle>Population Notes</SectionTitle>
              <p style={{ fontSize:13, color:'#94a3b8', lineHeight:1.75 }}>{p.population_notes}</p>
            </>}
            <p style={{ fontSize:11, color:'#475569', fontStyle:'italic', marginTop:4 }}>FAERS reports are voluntary, can contain duplicates, and cannot establish incidence or causality. ROR is not calculated in this MVP.</p>
          </div>
        )}

        {tab === 'confirm' && (
          <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
            <SectionTitle>Human Regulatory Determination</SectionTitle>
            {isDemo && (
              <div style={{ background:'#1e293b', border:'1px solid #334155', borderRadius:8, padding:'10px 14px', fontSize:12, color:'#64748b' }}>
                Demo mode — confirmation is stored locally in this session only.
              </div>
            )}
            <p style={{ fontSize:13, color:'#94a3b8', lineHeight:1.75 }}>
              The AI has built the evidentiary brief. You, as the qualified pharmacovigilance reviewer, make the regulatory determination.
              Your decision becomes part of the permanent audit trail.
            </p>

            {confirmed ? (
              <div style={{ background:'#14532d22', border:'1px solid #166534', borderRadius:8, padding:20, display:'flex', flexDirection:'column', gap:8, fontSize:13, color:'#94a3b8' }}>
                <p style={{ fontSize:15, fontWeight:700, color:'#86efac', marginBottom:4 }}>✓ Determination Recorded</p>
                <p><strong style={{ color:'#e2e8f0' }}>Reviewer:</strong> {confirmation?.reviewer_name}</p>
                <p><strong style={{ color:'#e2e8f0' }}>Decision:</strong> {confirmation?.reviewer_decision}</p>
                {confirmation?.reviewer_notes && <p><strong style={{ color:'#e2e8f0' }}>Notes:</strong> {confirmation.reviewer_notes}</p>}
              </div>
            ) : (
              <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
                {[
                  ['Reviewer Name *', <input key="name" placeholder="Full name" value={name} onChange={e=>setName(e.target.value)} style={{ background:'#1e293b', border:'1px solid #334155', borderRadius:6, padding:'8px 12px', color:'#e2e8f0', fontSize:14, outline:'none', width:'100%' }} />],
                  ['Regulatory Decision *', (
                    <select key="dec" value={decision} onChange={e=>setDecision(e.target.value)} style={{ background:'#1e293b', border:'1px solid #334155', borderRadius:6, padding:'8px 12px', color: decision ? '#e2e8f0' : '#64748b', fontSize:14, outline:'none', width:'100%' }}>
                      <option value="">Select decision…</option>
                      {['Submit 7-Day Expedited Report','Submit 15-Day Expedited Report','Include in Periodic Safety Report','Obtain Follow-Up Information','No Regulatory Action Required','Senior Medical Review Required'].map(o=><option key={o} style={{ color:'#e2e8f0' }}>{o}</option>)}
                    </select>
                  )],
                  ['Notes / Rationale', <textarea key="notes" placeholder="Notes, override rationale, or any deviation from AI recommendation…" value={notes} onChange={e=>setNotes(e.target.value)} rows={3} style={{ background:'#1e293b', border:'1px solid #334155', borderRadius:6, padding:'8px 12px', color:'#e2e8f0', fontSize:13, outline:'none', width:'100%', resize:'vertical' }} />],
                ].map(([label, input]) => (
                  <div key={label}>
                    <p style={{ fontSize:12, fontWeight:600, color:'#94a3b8', marginBottom:6 }}>{label}</p>
                    {input}
                  </div>
                ))}
                <button
                  onClick={doConfirm}
                  disabled={!name || !decision || confirming}
                  style={{ background:'#1d4ed8', color:'#fff', border:'none', borderRadius:6, padding:'10px 20px', fontSize:14, fontWeight:600, cursor:(!name||!decision||confirming)?'not-allowed':'pointer', opacity:(!name||!decision||confirming)?0.5:1, marginTop:4 }}
                >
                  {confirming ? 'Recording…' : 'Record Determination'}
                </button>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

/* ─── App ──────────────────────────────────────────────────────────────── */
function App() {
  const [appState, setAppState] = useState('idle'); // idle | processing | complete | error
  const [caseId, setCaseId] = useState(null);
  const [status, setStatus] = useState(null);
  const [brief, setBrief] = useState(null);
  const [isDemo, setIsDemo] = useState(false);
  const pollRef = useRef(null);

  const stopPoll = () => { if (pollRef.current) { clearInterval(pollRef.current); pollRef.current = null; } };

  const handleCaseStarted = (id) => { setIsDemo(false); setCaseId(id); setAppState('processing'); };

  const handleDemoSelected = (demo) => {
    stopPoll();
    setIsDemo(true);
    setBrief(demo.brief);
    setAppState('complete');
  };

  useEffect(() => {
    if (appState !== 'processing' || !caseId) return;
    pollRef.current = setInterval(async () => {
      try {
        const s = await pollStatus(caseId);
        setStatus(s);
        if (s.status === 'complete') {
          stopPoll();
          const b = await getBrief(caseId);
          setBrief(b);
          setAppState('complete');
        } else if (s.status === 'error') {
          stopPoll();
          setAppState('error');
        }
      } catch(e) { console.error('poll error', e); }
    }, 2000);
    return stopPoll;
  }, [appState, caseId]);

  const reset = () => { stopPoll(); setAppState('idle'); setCaseId(null); setStatus(null); setBrief(null); setIsDemo(false); };

  return (
    <div style={{ display:'flex', height:'100vh', overflow:'hidden' }}>
      {/* Left */}
      <div style={{ width:340, flexShrink:0, borderRight:'1px solid #1e293b', background:'#0d1117', display:'flex', flexDirection:'column', overflowY:'auto' }}>
        <UploadPanel onCaseStarted={handleCaseStarted} onDemoSelected={handleDemoSelected} />
        {appState !== 'idle' && (
          <button onClick={reset} style={{ margin:'0 20px 20px', background:'transparent', border:'1px solid #1e293b', color:'#475569', fontSize:12, padding:'7px 16px', borderRadius:6, cursor:'pointer' }}>
            ← Back to cases
          </button>
        )}
      </div>

      {/* Right */}
      <div style={{ flex:1, background:'#0a0f1a', display:'flex', flexDirection:'column', overflow:'hidden' }}>
        {appState === 'idle' && (
          <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:14, padding:48 }}>
            <div style={{ fontSize:52 }}>🧬</div>
            <p style={{ fontSize:16, fontWeight:500, color:'#334155', textAlign:'center', maxWidth:380 }}>Select a demo case or upload a PDF to generate a Case Intelligence Brief</p>
            <p style={{ fontSize:13, color:'#1e293b', textAlign:'center' }}>Regulatory · Clinical · Population</p>
          </div>
        )}

        {appState === 'processing' && <ProgressTracker status={status} />}

        {appState === 'complete' && brief && <BriefViewer brief={brief} isDemo={isDemo} onConfirmed={() => {}} />}

        {appState === 'error' && (
          <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:12, padding:48 }}>
            <p style={{ fontSize:18, fontWeight:600, color:'#ef4444' }}>Analysis failed</p>
            <p style={{ fontSize:13, color:'#94a3b8', textAlign:'center', maxWidth:400 }}>{status?.error || 'Unknown error'}</p>
            <button onClick={reset} style={{ background:'#1e293b', color:'#e2e8f0', border:'1px solid #334155', borderRadius:6, padding:'8px 20px', fontSize:14, cursor:'pointer', marginTop:8 }}>Try again</button>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
